<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7A1A" />
    <title>BONUVO — Hors connexion</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #101014;
        color: #f4f4f6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        border-radius: 20px;
        border: 1px solid #26262f;
        background: #18181f;
        padding: 28px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(255, 122, 26, 0.14);
        color: #ff7a1a;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        color: #a1a1b3;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #ff7a1a;
        color: #101014;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">BONUVO</span>
      <h1>Connexion Internet requise</h1>
      <p>
        Vous semblez actuellement hors ligne. Vérifiez votre connexion puis réessayez pour accéder
        aux offres vérifiées et aux pronostics BONUVO AI.
      </p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
